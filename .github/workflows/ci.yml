# graph-lint CI.
#
# Two jobs run: host-only builds and tests the pure C++17 core with no CUDA
# toolkit, cuda compiles the CUDA path (cuda_source.hpp, the example, the device
# suites, the demo) with nvcc. Hosted runners have no GPU, so the CUDA job
# compiles but does not execute: the device suites and the example exit 77 and
# ctest reports them SKIPPED.

name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------------------
  # 1. No CUDA, no nvcc, no GPU.
  # ---------------------------------------------------------------------------
  host-only:
    name: host-only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Ninja needs cl.exe on PATH on Windows; the runner's default shell keeps
      # this ahead of Git's own link.exe (passing through bash would not).
      - name: Setup MSVC developer command prompt (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Toolchain
        shell: bash
        run: |
          cmake --version
          ninja --version

      # -DGRAPHLINT_WITH_CUDA=OFF is the default, stated on purpose: this job must
      # fail if the core ever grows a dependency on the toolkit. GoogleTest is
      # fetched by CMake only when tests are enabled, pinned to a tag.
      - name: Configure (host-only, tests ON)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGRAPHLINT_BUILD_TESTS=ON
          -DGRAPHLINT_WITH_CUDA=OFF

      - name: Build (warnings are errors)
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600

      # The exported target, the include dir and the version file are the M1
      # deliverable: installing the package and building a separate consumer is
      # the only thing that notices when M2 changes them. The consumer is not
      # part of the main build (no add_subdirectory): it must find the package.
      - name: Install the package into a scratch prefix
        run: cmake --install build --prefix "${{ runner.temp }}/gl" --config Release

      # The reader ships only with GRAPHLINT_WITH_CUDA=ON. A package config that exports
      # graphlint::cuda on a machine without a toolkit breaks at the first consumer, and
      # nothing else in this job would notice.
      - name: The host-only package carries no reader
        run: cmake "-DPREFIX=${{ runner.temp }}/gl" -P tests/tools/check_host_package.cmake

      - name: Configure the consumer (find_package on the installed tree)
        run: >
          cmake -S tests/consumer -B build-consumer -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_PREFIX_PATH=${{ runner.temp }}/gl"

      - name: Build and run the consumer
        run: |
          cmake --build build-consumer
          ctest --test-dir build-consumer --output-on-failure

  # ---------------------------------------------------------------------------
  # 2. CUDA: compiles, never executes. Builds the only TU that includes
  #    <cuda_runtime.h>, the device suites and the demo with nvcc, so a break in
  #    the CUDA path is red at build time on a free runner. There is no card
  #    here: every device suite exits 77 (SKIP_RETURN_CODE), ctest prints "The
  #    following tests did not run" and reports SKIPPED. That is not tolerated
  #    with continue-on-error: a build failure, or a missing toolkit, must fail
  #    the job; only a built binary with no device is allowed to skip.
  #
  # Notes on the matrix:
  #   - ubuntu 11.8 / 12.1 and windows 12.9, installed by Jimver/cuda-toolkit;
  #   - on Windows NVCC_PREPEND_FLAGS=--allow-unsupported-compiler, because the
  #     image's MSVC is newer than the toolkit's version table knows;
  #   - CMAKE_CUDA_ARCHITECTURES=75 is the same arch the GPU box runs: sm_75 is
  #     compiled, not executed, so the runner needs no NVIDIA hardware.
  # ---------------------------------------------------------------------------
  cuda:
    name: cuda (${{ matrix.os }}, CUDA ${{ matrix.cuda }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, cuda: "11.8.0", nvcc_prepend: "" }
          - { os: ubuntu-22.04, cuda: "12.1.1", nvcc_prepend: "" }
          - { os: windows-2022, cuda: "12.9.2", nvcc_prepend: "--allow-unsupported-compiler" }
    env:
      NVCC_PREPEND_FLAGS: ${{ matrix.nvcc_prepend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSVC developer command prompt (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA ${{ matrix.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: network

      # Device tests ON on purpose: it makes nvcc compile the .cu fixtures and
      # enable_language(CUDA), so the job proves the CUDA path instead of only
      # compiling a host TU against the headers. Examples too: the entry exits
      # 77 on a runner with no card, but the compile is what CI is here for.
      - name: Configure (CUDA ON, tests ON, device tests ON)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DGRAPHLINT_BUILD_TESTS=ON
          -DGRAPHLINT_WITH_CUDA=ON
          -DGRAPHLINT_BUILD_DEVICE_TESTS=ON
          -DGRAPHLINT_BUILD_EXAMPLES=ON

      - name: Build (warnings are errors, headers included)
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600

      # The reader is part of the package: installing it and building a separate consumer
      # is the only thing that notices when the export drops graphlint::cuda or its header.
      # No card is needed: the consumer's from_cuda branch is behind argc.
      - name: Install the package into a scratch prefix
        run: cmake --install build --prefix "${{ runner.temp }}/gl" --config Release

      - name: Configure the CUDA consumer (find_package on the installed tree)
        run: >
          cmake -S tests/consumer_cuda -B build-consumer-cuda -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_PREFIX_PATH=${{ runner.temp }}/gl"

      - name: Build and run the CUDA consumer
        run: |
          cmake --build build-consumer-cuda
          ctest --test-dir build-consumer-cuda --output-on-failure

  # ---------------------------------------------------------------------------
  # 3. GPU: the same build with a real card, so the device suites PASS instead
  #    of skipping. Still commented out: no self-hosted runner with an NVIDIA
  #    GPU is registered for this repo, and enabling it as-is would park a job
  #    in "queued" forever. Do not replace it by relaxing job 2: a green tick
  #    from a runner with no device hides tests that never ran.
  # ---------------------------------------------------------------------------
